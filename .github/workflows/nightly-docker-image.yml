name: docker-image

# Build the Docker image from this repository on merges to main and every night,
# publishing it to this repository's GitHub Container Registry namespace. The
# Dockerfile is the source of truth for the image; no workflow or build output
# is imported from a different repository.

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron schedules use UTC. Run every night at 04:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly-docker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=sha,prefix=release-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=nightly-,enable=${{ github.event_name == 'schedule' }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERMES_WRAPPER_REV=${{ github.sha }}
            HERMES_RELEASE_CHANNEL=${{ github.event_name == 'schedule' && 'nightly' || 'stable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
