name: docker-build

# Build the Hermes Web frontend Docker image and publish to GHCR. The build is
# NIX-FREE: the Dockerfile fetches the renderer pinned by flake.lock
# and builds with plain pnpm —
# a normal `docker build` in CI and locally. The container only serves static
# files + proxies to a gateway.
#
# Triggers: push to main, v* tags, manual dispatch, AND a DAILY 04:00 UTC build
# to rebuild the currently pinned renderer.

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild the pinned renderer every day at 04:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, X64, hermes-web, dev]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=release-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HERMES_WRAPPER_REV=${{ github.sha }}
            HERMES_RELEASE_CHANNEL=stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
