name: quick-image-build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-publication
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify image and tags
        id: identity
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=$image"
            echo 'tags<<EOF'
            echo "$image:latest"
            echo "$image:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "$image:main"
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$image:${GITHUB_REF#refs/tags/v}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.identity.outputs.tags }}
          build-args: |
            HERMES_WRAPPER_REV=${{ github.sha }}
            HERMES_RELEASE_CHANNEL=stable
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.hermes.release.channel=stable
