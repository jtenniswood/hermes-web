name: interface-comparison-preview
on:
  pull_request:
    branches: ['codex/tested-renderer-releases']
permissions:
  contents: read
concurrency:
  group: comparison-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review-image:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/interface-comparison'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: node scripts/renderer.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:foundation
      - id: identity
        name: Identify the review build
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=pr-${{ github.event.pull_request.number }}-$(git rev-parse HEAD)-$(node scripts/renderer.mjs --revision)"
            echo "renderer=$(node scripts/renderer.mjs --revision)"
            echo "lock_hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build comparison nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}
          build-args: |
            HERMES_WRAPPER_REV=${{ github.event.pull_request.head.sha }}
            HERMES_RELEASE_CHANNEL=comparison
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            io.hermes.renderer.revision=${{ steps.identity.outputs.renderer }}
            io.hermes.dependency-lock.sha256=${{ steps.identity.outputs.lock_hash }}
            io.hermes.release.channel=comparison
          cache-from: type=gha,scope=comparison
          cache-to: type=gha,mode=max,scope=comparison
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare both interfaces through the built nginx image
        run: pnpm exec playwright test tests/browser/comparison.spec.mjs
        env:
          HERMES_COMPARISON_IMAGE: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            test-results
            playwright-report
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested review image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}
        run: docker push "$IMAGE"
      - name: Publish the matching synthetic gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          target: preview-gateway
          push: true
          tags: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}-gateway
          cache-from: type=gha,scope=comparison
      - name: Record runnable images
        env:
          IMAGE: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}
        run: |
          echo "HERMES_COMPARISON_IMAGE=$IMAGE" > comparison-images.env
          echo "HERMES_PREVIEW_GATEWAY_IMAGE=$IMAGE-gateway" >> comparison-images.env
          cat comparison-images.env >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-images-${{ github.event.pull_request.head.sha }}
          path: comparison-images.env
