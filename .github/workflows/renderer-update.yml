name: renderer-update
on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      renderer_revision:
        description: Exact upstream commit for one-off validation; empty resolves upstream main
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: renderer-update-proposal
  cancel-in-progress: false
jobs:
  disabled:
    if: github.event_name != 'workflow_dispatch' && vars.HERMES_RENDERER_UPDATES_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain setup requirements
        run: echo 'Renderer proposals are disabled. Run node scripts/check-update-setup.mjs and follow docs/upstream-updates.md to configure and verify automation.' >> "$GITHUB_STEP_SUMMARY"
  propose:
    if: github.event_name == 'workflow_dispatch' || vars.HERMES_RENDERER_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the main workflow for a one-off validation
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Dispatch renderer-update.yml from main. No proposal was created.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Validate updater configuration
        env:
          APP_ID: ${{ vars.HERMES_UPDATER_APP_ID }}
          APP_KEY: ${{ secrets.HERMES_UPDATER_PRIVATE_KEY }}
          UPDATER_LOGIN: ${{ vars.HERMES_UPDATER_LOGIN }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ] || [ -z "$UPDATER_LOGIN" ]; then
            echo 'Updater App configuration is incomplete. Follow docs/upstream-updates.md.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.HERMES_UPDATER_APP_ID }}
          private-key: ${{ secrets.HERMES_UPDATER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Propose one exact renderer update
        run: node scripts/propose-renderer-update.mjs
        env:
          HERMES_RENDERER_UPDATES_ENABLED: ${{ vars.HERMES_RENDERER_UPDATES_ENABLED }}
          HERMES_RENDERER_REVISION: ${{ inputs.renderer_revision }}
          HERMES_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HERMES_UPDATER_LOGIN: ${{ vars.HERMES_UPDATER_LOGIN }}
