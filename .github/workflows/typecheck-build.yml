name: compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Prepare exact renderer
        run: node scripts/renderer.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:renderer
      - run: pnpm typecheck
      - run: pnpm test:foundation
      - run: pnpm --filter web-desktop test:gateway
      - name: Build production frontend
        run: pnpm build
        env:
          HERMES_WRAPPER_REV: ${{ github.sha }}
          HERMES_RELEASE_CHANNEL: verification
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web-desktop/dist
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Verify locked Nix inputs and evaluate package
        run: nix eval .#packages.x86_64-linux.default.drvPath --no-write-lock-file
      - name: Verify Nix dependency closure
        run: nix build .#packages.x86_64-linux.default.pnpmDeps --no-link --no-write-lock-file
