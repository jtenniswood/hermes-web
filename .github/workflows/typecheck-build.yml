name: compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renderer-update-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/renderer-update-policy.mjs
        env:
          HERMES_UPDATER_LOGIN: ${{ vars.HERMES_UPDATER_LOGIN }}
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Prepare exact renderer
        run: node scripts/renderer.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:renderer
      - run: pnpm typecheck
      - run: pnpm test:foundation
      - run: pnpm --filter web-desktop test:gateway
      - name: Build production frontend
        run: pnpm build
        env:
          HERMES_WRAPPER_REV: ${{ github.sha }}
          HERMES_RELEASE_CHANNEL: verification
      - name: Build nginx image
        run: docker build --build-arg HERMES_WRAPPER_REV=${{ github.sha }} --build-arg HERMES_RELEASE_CHANNEL=verification -t hermes-web:verification .
      - name: Verify production routing
        run: pnpm --filter web-desktop test:gateway
        env:
          HERMES_TEST_IMAGE: hermes-web:verification
      - name: Install browsers for production-image tests
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify browser state and update safety through nginx
        run: pnpm exec playwright test
        env:
          HERMES_TEST_IMAGE: hermes-web:verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            test-results
            playwright-report
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web-desktop/dist
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Verify locked Nix inputs and evaluate package
        run: nix eval .#packages.x86_64-linux.default.drvPath --no-write-lock-file
      - name: Verify Nix dependency closure
        run: nix build .#packages.x86_64-linux.default.pnpmDeps --no-link --no-write-lock-file
